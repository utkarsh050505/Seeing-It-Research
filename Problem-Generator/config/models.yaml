# Model settings for the project. Keep model IDs here, never in code.
# API keys are NOT stored here: each provider reads its key from the
# environment variable named in `api_key_env`.

# Writer model: turns a pasted research finding into a candidate problem + clue.
# gpt-oss is used only as writer/judge and must never be added as a test model.
writer:
  provider: groq            # pick one of the providers listed below
  temperature: 0.3          # low = steadier extractions (writer only; test models use 0.7)
  max_completion_tokens: 8000   # includes the model's hidden reasoning, so keep it generous
  reasoning_effort: high    # gpt-oss setting: low | medium | high
  seed: 12345

# Problem + clue writer (src/generate/make_problem.py): turns a statement into the problem, the expected
# answer, the reason it is right and the short clue. High temperature so each version differs;
# a fresh random seed is drawn for every call and saved with the result. Its checkers use `judge` below.
# Keep reasoning_effort at medium: on the Groq free plan (8,000 tokens a minute) "high" doesn't fit.
problem:
  provider: groq
  temperature: 1.0
  max_completion_tokens: 4000
  reasoning_effort: medium

# Memory check (src/generate/memory_check.py): turns a statement into the questions we ask the test models
# about the finding, without giving the answer away. A fresh random seed is drawn for every call and saved.
memory_questions:
  provider: groq
  temperature: 0.7
  max_completion_tokens: 4000
  reasoning_effort: medium

# Checker (the judge of context.md section 5): reads one test-model answer and marks it.
# Temperature 0 and a fixed seed, so the same answer gets the same mark.
judge:
  provider: groq
  temperature: 0
  max_completion_tokens: 4000
  reasoning_effort: medium
  seed: 12345

memory_check:
  tries: 3     # each question is asked this many times per model, with seeds seed+1 ... seed+tries
  seed: 42

# Difficulty filter (src/generate/difficulty_filter.py, context.md section 3.2 step 5). Decided 11-12 Nov.
difficulty_filter:
  tries: 10        # each model answers the problem alone and with the clue this many times (seeds seed+1 ...)
  seed: 7
  alone_max: 0.30  # per strength group, tries pooled: solved alone in at most this share
  clue_min: 0.80   # per strength group, tries pooled: solved with the clue in at least this share
  clue_groups: [strong, middle]   # groups that must reach clue_min; the others' clue result is only reported

# OpenAI-compatible providers that host gpt-oss-120b.
# Check the model ID on the provider's site before first use.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    # Several keys: calls use the first; when it reaches its daily limit, the next. Keys not in .env are skipped.
    api_key_env: [GROQ_API_KEY, GROQ_API_KEY_2]
    model: openai/gpt-oss-120b
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: openai/gpt-oss-120b
  together:
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    model: openai/gpt-oss-120b
  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    model: gpt-oss-120b
  fireworks:
    base_url: https://api.fireworks.ai/inference/v1
    api_key_env: FIREWORKS_API_KEY
    model: accounts/fireworks/models/gpt-oss-120b

# Our own Ollama on the lab PC (src/setup/download_models.ps1). Never the default port 11434: that one is
# someone else's.
ollama:
  host: 127.0.0.1:11500

# Settings for every test-model call (context.md section 4).
test_settings:
  temperature: 0.7
  num_ctx: 32768              # room for the longest chat; all 8 local models fit (src/setup/test_models.py, 11 Nov)
  max_tokens: 2048            # thinking off
  max_tokens_thinking: 16384  # models that can't stop thinking (OLMo Think)

# Test models (context.md section 4). Never add gpt-oss here.
#   group:    strength group from the Nov 2026 quick check (strong / middle / weak); look again after the
#             first statements
#   route:    local = our Ollama above; api = provider not picked yet, so these are skipped for now
#   thinking: switch = can be turned off (off for now), always = can't be turned off, none = never thinks,
#             unknown = not checked yet
test_models:
  - {id: llama3.2:3b-instruct-fp16, name: Llama 3.2 3B, group: weak, route: local, thinking: none}
  - {id: qwen3.5:4b-bf16, name: Qwen3.5 4B, group: strong, route: local, thinking: switch}
  - {id: llama3.1:8b-instruct-fp16, name: Llama 3.1 8B, group: middle, route: local, thinking: none}
  - {id: qwen3.5:9b-bf16, name: Qwen3.5 9B, group: middle, route: local, thinking: switch}
  - {id: gemma4:12b-it-q8_0, name: Gemma 4 12B, group: strong, route: local, thinking: switch}
  - {id: qwen3:14b-q8_0, name: Qwen3 14B, group: middle, route: local, thinking: switch}
  - {id: qwen3.5-27b, name: Qwen3.5 27B, group: strong, route: api, thinking: switch}    # id set once the provider is picked
  - {id: gemma4-31b, name: Gemma 4 31B, group: strong, route: api, thinking: unknown}    # id set once the provider is picked
  - {id: olmo-3:7b-instruct-fp16, name: OLMo 3 7B Instruct, group: weak, route: local, thinking: none}
  - {id: olmo-3:7b-think-fp16, name: OLMo 3 7B Think, group: middle, route: local, thinking: always}
